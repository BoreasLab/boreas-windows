# Continuous integration for the Windows control client.
#
# Two effect domains, so two jobs.
#
#   core  ubuntu, cheap. Builds and runs the OS-independent laws: the release
#         tag algebra and how it renders into version fields, the ABI's
#         layout and widths, both vtables' obligations, the configuration
#         lowering, the state machine the interface renders, the form's parser,
#         and the design system measured out of the XAML. Also the boundary
#         check: both test projects target plain net10.0, and the UI one
#         compiles the functional core from source, so a Microsoft.UI reference
#         creeping into Contracts, Presentation or either channel fails here.
#
#         The interop laws belong on Linux and not on the Windows job, which is
#         the point of them: a layout assertion that only runs where the bug is
#         expensive is not a defence. boreas.dll is never loaded here - nothing
#         in those laws calls it - so they cost a Linux runner and catch the
#         three marshalling traps before any hardware is involved.
#
#   app   windows, the only place WinUI 3 builds. Produces the artifact.
#
# There is no `needs:` edge between them. Neither consumes the other's output,
# and running both means one push reports both results instead of hiding the
# second behind the first.
#
# Assertions about the tunnel itself belong to the phases that build it. When
# the control protocol lands, its conformance tests join `core`, and the
# device matrix in docs/implementation-plan.md runs where real hardware is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No ambient capability. Each job asks for exactly what it needs, and none of
# them needs more than read.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only the newest run of a branch under review is interesting; a push to the
  # default branch is a record and is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# DOTNET_SKIP_FIRST_TIME_EXPERIENCE is deliberately absent: it has been
# unsupported since .NET Core 3.0, and DOTNET_NOLOGO replaced it. Setting it
# looked like belt and braces and was a no-op.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  core:
    name: Core laws (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Each suite's result matters on its own: a layout law failing and a
      # presentation law failing are different problems with different owners,
      # and one cancelling the other turns two answers into one.
      fail-fast: false
      matrix:
        include:
          - name: build
            project: tests/Boreas.Build.Tests/Boreas.Build.Tests.csproj
          - name: interop
            project: tests/Boreas.Interop.Tests/Boreas.Interop.Tests.csproj
          - name: ui
            project: tests/Boreas.Ui.Tests/Boreas.Ui.Tests.csproj
    steps:
      - uses: actions/checkout@v7
        with:
          # The job reads the tree and writes nothing back, so it has no use
          # for a credential in the local git config.
          persist-credentials: false
          submodules: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # --locked-mode is not used: no lock file exists until W0 pins the
      # dependency set. Central package management already forbids floating
      # versions, so every package resolves to the exact version in
      # Directory.Packages.props.
      - name: Restore
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: dotnet restore "$PROJECT"

      - name: Build
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      # No --logger: that is a VSTest option, and xunit v3 runs on Microsoft
      # Testing Platform. A TRX report would mean adding the TRX extension
      # package back; the runner already names every failure on stdout, which
      # is where anyone reading a red build looks first.
      - name: Test
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: dotnet test "$PROJECT" --configuration Release --no-build

  app:
    name: App (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # gh attestation verify reads the build provenance attached to the
      # boreas-core release. Without this the fetch refuses, which is the
      # correct failure and a confusing one to debug.
      attestations: read
    strategy:
      # Every cell's result matters on its own. Cancelling the arm64 build
      # because x64 broke turns "which targets build" into "one target broke".
      fail-fast: false
      matrix:
        # Named cells rather than a product: the Debug cell exists only to
        # prove the sample channel still compiles, and there is no reason to
        # build it twice.
        # No rid column. The project derives the runtime identifier from the
        # platform, so naming it here would be a second copy of the same fact
        # and the two could disagree; passing --runtime would in fact win over
        # the project and reintroduce exactly the mismatch that derivation
        # removes.
        include:
          - configuration: Release
            platform: x64
            publish: true
          - configuration: Release
            platform: ARM64
            publish: true
          - configuration: Debug
            platform: x64
            publish: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Matrix values reach the shell through the environment and are read as
      # quoted variables. Nothing here is attacker-controlled today, but a
      # value spliced into a run: block is evaluated as script, and that is a
      # habit worth not having when the next value comes from an event
      # payload. One shell across every job, so there is one quoting rule.
      # Before restore, because the project refuses to build without them and
      # says so by name. api/artifacts.md: an artefact fetched on every build is
      # a supply-chain edge, and provenance is the check that guards it - "do
      # this in CI, not just once by hand". The script does both checks on every
      # run, so a cached archive is never trusted on the strength of a check
      # that happened somewhere else.
      - name: Fetch native libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-native.sh

      - name: Restore
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: dotnet restore src/Boreas.Ui/Boreas.Ui.csproj -p:Platform="$PLATFORM"

      - name: Build
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: >-
          dotnet build src/Boreas.Ui/Boreas.Ui.csproj
          --configuration "$CONFIGURATION"
          -p:Platform="$PLATFORM"
          --no-restore

      - name: Publish
        if: ${{ matrix.publish }}
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: >-
          dotnet publish src/Boreas.Ui/Boreas.Ui.csproj
          --configuration "$CONFIGURATION"
          -p:Platform="$PLATFORM"
          --output "artifacts/app/$PLATFORM"

      # Unsigned, unpinned, and built from a dependency set W0 has not yet
      # admitted. This is a build output for inspection, not a release
      # candidate, and the retention window says so.
      - name: Upload unsigned build
        if: ${{ matrix.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: boreas-ui-unsigned-${{ matrix.platform }}
          path: artifacts/app/${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      # Fetched by exact version and verified against a checksum recorded here,
      # so this step cannot be changed by anything happening upstream. It also
      # ShellChecks the run: blocks above.
      - name: Run actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: ./.github/scripts/actionlint.sh

      # zizmor reads workflows for the failure modes actionlint does not model:
      # excessive permissions, unpinned actions, credential persistence, and
      # untrusted interpolation into a shell.
      - name: Run zizmor
        shell: bash
        env:
          ZIZMOR_VERSION: 1.29.0
        run: ./.github/scripts/zizmor.sh
